name: OpenCraw CI
run-name: OpenCraw CI retained gate ${{ inputs.target_sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact commit SHA to validate; blank uses the triggering SHA
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  quality:
    name: Format, lint, and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          persist-credentials: false
          submodules: false

      - name: Install frozen dependencies
        uses: ./.github/actions/setup-node-env
        with:
          frozen-lockfile: "true"
          install-bun: "false"

      - name: Validate repository manifests and runner policy
        run: pnpm validation:manifests && pnpm validation:policy

      - name: Check formatting
        run: pnpm format:check

      - name: Full repository type-aware lint
        run: pnpm lint:full

      - name: UI localization validation
        run: pnpm lint:ui:i18n

      - name: Typecheck production projects
        run: pnpm tsgo:prod

  tests:
    name: Supported OpenCraw test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          persist-credentials: false
          submodules: false

      - name: Install frozen dependencies
        uses: ./.github/actions/setup-node-env
        with:
          frozen-lockfile: "true"
          install-bun: "false"

      - name: Validate test classification and skip ledger
        run: pnpm validation:manifests

      - name: Run supported OpenCraw suite
        run: pnpm test:opencraw

  build:
    name: Production build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          persist-credentials: false
          submodules: false

      - name: Install frozen dependencies
        uses: ./.github/actions/setup-node-env
        with:
          frozen-lockfile: "true"
          install-bun: "false"

      - name: Build production artifacts
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm build

      - name: Smoke test built CLI
        run: node openclaw.mjs --help

  security:
    name: Security, secrets, and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout full scan range
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Install frozen dependencies and TruffleHog
        uses: ./.github/actions/setup-node-env
        with:
          frozen-lockfile: "true"
          install-bun: "false"
          install-trufflehog: "true"

      - name: Resolve bounded secret scan range
        id: scan-range
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$EVENT_BASE_SHA"
          if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ ]] ||
            [[ "$base_sha" == "0000000000000000000000000000000000000000" ]] ||
            ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          echo "base=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Scan changed commits for leaked credentials
        env:
          BASE_SHA: ${{ steps.scan-range.outputs.base }}
        run: >-
          trufflehog git file://.
          --since-commit "$BASE_SHA"
          --branch HEAD
          --results=verified,unknown
          --fail
          --fail-on-scan-errors

      - name: Install workflow audit runner
        run: python3 -m pip install --disable-pip-version-check pre-commit==4.2.0

      - name: Detect committed private keys
        run: pre-commit run --all-files detect-private-key

      - name: Validate retained workflow policy
        run: pnpm validation:policy

      - name: Validate and audit workflows
        run: pnpm check:workflows

      - name: Audit production dependencies
        run: node scripts/pre-commit/pnpm-audit-prod.mjs --audit-level=high
