name: Install Smoke

on:
  workflow_dispatch:
    inputs:
      run_bun_global_install_smoke:
        description: Run the Bun global install image-provider smoke
        required: false
        default: false
        type: boolean
      update_baseline_version:
        description: Baseline openclaw version or dist-tag for installer update smoke
        required: false
        default: latest
        type: string

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  install_smoke:
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/install-smoke-reusable.yml
    with:
      allow_unreleased_changelog: true
      ref: ${{ github.sha }}
      run_bun_global_install_smoke: ${{ inputs.run_bun_global_install_smoke }}
      update_baseline_version: ${{ inputs.update_baseline_version || 'latest' }}
