name: Setup Node environment
description: >
  Install Node 24 by default, pnpm, optional Bun, optional TruffleHog, and
  frozen repository dependencies on the retained GitHub-hosted runner.
inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: "24.x"
  install-bun:
    description: Whether to install Bun alongside Node.
    required: false
    default: "false"
  install-trufflehog:
    description: Whether to install the pinned TruffleHog binary.
    required: false
    default: "false"
  install-deps:
    description: Whether to run pnpm install after environment setup.
    required: false
    default: "true"
  frozen-lockfile:
    description: Whether to use --frozen-lockfile for install.
    required: false
    default: "true"
  use-actions-cache:
    description: Whether to restore the pnpm store with actions/cache.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Normalize container toolcache
      shell: bash
      run: |
        set -euo pipefail
        if [[ -d /__t && ! -e /opt/hostedtoolcache ]]; then
          mkdir -p /opt
          ln -s /__t /opt/hostedtoolcache
        fi

    - name: Setup Node.js
      shell: bash
      env:
        REQUESTED_NODE_VERSION: ${{ inputs.node-version }}
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../setup-pnpm-store-cache/ensure-node.sh"
        openclaw_ensure_node "$REQUESTED_NODE_VERSION"

    - name: Setup pnpm
      uses: ./.github/actions/setup-pnpm-store-cache
      with:
        node-version: ${{ inputs.node-version }}
        use-actions-cache: ${{ inputs.use-actions-cache }}

    - name: Setup TruffleHog
      if: inputs.install-trufflehog == 'true'
      shell: bash
      run: bash scripts/install-trufflehog.sh

    - name: Setup Bun
      if: inputs.install-bun == 'true'
      shell: bash
      run: npm install -g bun@1.3.14

    - name: Runtime versions
      shell: bash
      run: |
        set -euo pipefail
        node -v
        npm -v
        pnpm -v
        if command -v bun >/dev/null 2>&1; then
          bun -v
        fi

    - name: Capture Node path
      shell: bash
      run: |
        set -euo pipefail
        node_bin="$(dirname "$(node -p 'process.execPath')")"
        if command -v cygpath >/dev/null 2>&1; then
          node_bin="$(cygpath -u "$node_bin")"
        fi
        echo "NODE_BIN=$node_bin" >> "$GITHUB_ENV"
        echo "$node_bin" >> "$GITHUB_PATH"

    - name: Install dependencies
      if: inputs.install-deps == 'true'
      shell: bash
      env:
        CI: "true"
        FROZEN_LOCKFILE: ${{ inputs.frozen-lockfile }}
      run: |
        set -euo pipefail
        export PATH="${NODE_BIN:?}:$PATH"
        install_args=(
          install
          --prefer-offline
          --ignore-scripts=false
          --config.engine-strict=false
          --config.enable-pre-post-scripts=true
          --config.side-effects-cache=true
        )
        case "$FROZEN_LOCKFILE" in
          true) install_args+=(--frozen-lockfile) ;;
          false) ;;
          *)
            echo "::error::Invalid frozen-lockfile input: '$FROZEN_LOCKFILE' (expected true or false)"
            exit 2
            ;;
        esac
        pnpm "${install_args[@]}"
